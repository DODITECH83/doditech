<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DODITECH · Guide in pillole per smanettoni</title>
<meta name="description" content="Guide brevi, gratuite e pratiche su Windows, Android, sicurezza, rete e privacy. Archivio con ricerca del canale Telegram DODITECH.">
<meta name="theme-color" content="#2547f5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232547f5'/%3E%3Cpath d='M8 10l7 6-7 6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 23h8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#0f172a; --muted:#566178; --line:#d8dde7;
  --accent:#2547f5; --accent-ink:#ffffff; --accent-soft:#e8edff;
  --warn-bg:#fff4dc; --warn-line:#d98f00; --tip-bg:#e8edff; --tip-line:#2547f5;
  --code-bg:#0f172a; --code-ink:#e6edf7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220; --surface:#151c2e; --ink:#e7ecf5; --muted:#9aa6bd; --line:#26304a;
    --accent:#8aa0ff; --accent-ink:#0d1220; --accent-soft:#1b2547;
    --warn-bg:#2a2110; --warn-line:#e0a52c; --tip-bg:#17224a; --tip-line:#8aa0ff;
    --code-bg:#070b16; --code-ink:#e6edf7;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2e; --ink:#e7ecf5; --muted:#9aa6bd; --line:#26304a;
  --accent:#8aa0ff; --accent-ink:#0d1220; --accent-soft:#1b2547;
  --warn-bg:#2a2110; --warn-line:#e0a52c; --tip-bg:#17224a; --tip-line:#8aa0ff;
  --code-bg:#070b16; --code-ink:#e6edf7;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:0 16px}

/* intestazione */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand svg{width:34px;height:34px;flex:none}
.top-actions{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;cursor:pointer;min-height:40px}
.pill:hover{border-color:var(--accent)}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon-btn{width:40px;height:40px;padding:0;justify-content:center}

.hero{padding:34px 0 12px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1.04;letter-spacing:-.025em;margin:0 0 10px;max-width:16ch}
.hero p{margin:0 0 22px;color:var(--muted);max-width:52ch;font-size:18px}

.prompt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:0 14px;box-shadow:5px 5px 0 var(--accent)}
.prompt:focus-within{border-color:var(--accent)}
.prompt .sym{font-family:var(--mono);font-weight:500;font-size:22px;color:var(--accent);user-select:none}
.prompt input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:18px;padding:16px 0;outline:none}
.prompt input::placeholder{color:var(--muted);opacity:.8}
.prompt .clear{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:6px 8px;border-radius:8px;display:none}
.prompt .clear.on{display:block}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px;font-weight:500;min-height:38px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:400;margin-left:4px}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 4px;color:var(--muted);font-size:15px}
.meta-row select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:38px}

/* elenco */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:block;padding:20px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover .row-title{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.row-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;font-size:14px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none}
.row-title{font-family:var(--display);font-weight:600;font-size:clamp(20px,3.4vw,25px);line-height:1.2;letter-spacing:-.01em;margin:0 0 4px}
.row-sum{margin:0;color:var(--muted);max-width:68ch}
.empty{padding:40px 4px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:22px;margin-bottom:6px}
.empty .pill{margin-top:14px}

/* lettura */
.read{padding:18px 0 30px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:500;color:var(--muted);padding:8px 0;min-height:40px}
.back:hover{color:var(--accent)}
.read h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.02em;margin:10px 0 12px;max-width:22ch}
.read .lead{font-size:19px;color:var(--muted);margin:0 0 14px;max-width:60ch}
.read-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:14px;color:var(--muted);margin-bottom:22px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--surface);cursor:pointer}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.article{max-width:68ch}
.article p{margin:0 0 14px}
.article ul{margin:0 0 16px;padding-left:22px}
.article li{margin:4px 0}
.steps{list-style:none;counter-reset:s;margin:6px 0 18px;padding:0}
.steps li{counter-increment:s;position:relative;padding:4px 0 4px 46px;margin:10px 0;min-height:32px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:15px}
.cmd{display:flex;align-items:stretch;background:var(--code-bg);color:var(--code-ink);border-radius:10px;margin:8px 0 16px;overflow:hidden}
.cmd code{flex:1;min-width:0;font-family:var(--mono);font-size:15px;padding:12px 14px;overflow-x:auto;white-space:pre}
.cmd code::before{content:"> ";opacity:.5}
.cmd button{border:0;border-left:1px solid rgba(255,255,255,.14);background:transparent;color:var(--code-ink);cursor:pointer;padding:0 14px;font-size:14px;min-width:78px}
.cmd button:hover{background:rgba(255,255,255,.1)}
.note{border-left:4px solid var(--c);background:var(--b);border-radius:0 10px 10px 0;padding:10px 14px;margin:6px 0 16px}
.note b{display:block;font-size:14px;margin-bottom:2px}
.note.warn{--c:var(--warn-line);--b:var(--warn-bg)}
.note.tip{--c:var(--tip-line);--b:var(--tip-bg)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 10px}
.more{margin-top:34px;padding-top:6px}
.more h2{font-family:var(--display);font-size:22px;margin:0 0 4px}

/* piè di pagina */
.foot{margin-top:40px;border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:15px}
.foot-in{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.foot a{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.on{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
@media (max-width:520px){
  body{font-size:16.5px}
  .pill .lbl{display:none}
  .pill{padding:8px 12px}
  .prompt{box-shadow:4px 4px 0 var(--accent)}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#" aria-label="DODITECH, vai all'archivio">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 10l7 6-7 6" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 23h8" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/></svg>
      DODITECH
    </a>
    <div class="top-actions">
      <a class="pill primary" href="https://t.me/doditech" target="_blank" rel="noopener">Telegram</a>
      <a class="pill" href="https://youtube.com/@adrydoditech" target="_blank" rel="noopener">YouTube</a>
      <button class="pill icon-btn" id="theme" type="button" aria-label="Cambia tema chiaro o scuro" title="Cambia tema">◐</button>
    </div>
  </header>

  <main id="main">
    <section id="home">
      <div class="hero">
        <h1>Guide brevi per smanettoni</h1>
        <p id="sub">Trucchi, strumenti gratuiti e procedure passo passo. Una cosa alla volta, da provare subito.</p>
        <label class="sr" for="q">Cerca una guida</label>
        <div class="prompt">
          <span class="sym" aria-hidden="true">&gt;</span>
          <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="cerca: wifi, password, backup…">
          <button class="clear" id="clear" type="button" aria-label="Cancella la ricerca">×</button>
        </div>
      </div>
      <div class="filters" id="chips" role="group" aria-label="Filtra per categoria"></div>
      <div class="meta-row">
        <span id="count" aria-live="polite"></span>
        <label>Tipo: <select id="tipo" aria-label="Filtra per tipo"></select></label>
      </div>
      <ul class="list" id="list"></ul>
    </section>

    <article id="read" class="read" hidden></article>
  </main>

  <footer class="foot">
    <div class="foot-in">
      <span>DODITECH · guide gratuite, pensate per essere lette in due minuti.</span>
      <span><a href="https://t.me/doditech" target="_blank" rel="noopener">Torna al canale Telegram</a> · <a href="https://youtube.com/@adrydoditech" target="_blank" rel="noopener">Canale YouTube</a></span>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="guides.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var norm = function(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); };

  var G = (window.GUIDE || []).slice().sort(function(a,b){ return (b.data||"").localeCompare(a.data||""); });
  G.forEach(function(g){
    g.tag = g.tag || [];
    g._all = norm([g.titolo,g.sommario,g.categoria,g.tipo,g.tag.join(" "),g.testo].join(" "));
    g._head = norm([g.titolo,g.tag.join(" ")].join(" "));
  });

  var state = { q:"", cat:"", tipo:"" };

  function hue(name){ var h=0; for(var i=0;i<name.length;i++){ h=(h*31+name.charCodeAt(i))%360; } return h; }
  function colorFor(name){ return "hsl("+hue(name)+" 62% 48%)"; }
  function fmtDate(d){
    if(!d) return "";
    var dt = new Date(d+"T12:00:00");
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
  }
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1800);
  }
  function copy(text){
    function fallback(){
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); return ok;
    }
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){return true;},function(){return fallback();});
    }
    return Promise.resolve(fallback());
  }

  /* tema */
  function applyTheme(t){ if(t){ document.documentElement.setAttribute("data-theme",t); } }
  try{ applyTheme(localStorage.getItem("doditech-theme")); }catch(e){}
  $("theme").addEventListener("click",function(){
    var cur = document.documentElement.getAttribute("data-theme");
    if(!cur){ cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
    var next = cur === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem("doditech-theme",next); }catch(e){}
  });

  /* filtri */
  function categories(){
    var m = {};
    G.forEach(function(g){ m[g.categoria] = (m[g.categoria]||0)+1; });
    return Object.keys(m).sort().map(function(k){ return {name:k,n:m[k]}; });
  }
  function types(){
    var m = {}; G.forEach(function(g){ if(g.tipo) m[g.tipo]=1; });
    return Object.keys(m).sort();
  }
  function buildFilters(){
    var html = '<button class="chip" type="button" data-cat="" aria-pressed="true">Tutte<span class="n">'+G.length+'</span></button>';
    categories().forEach(function(c){
      html += '<button class="chip" type="button" data-cat="'+esc(c.name)+'" aria-pressed="false">'+esc(c.name)+'<span class="n">'+c.n+'</span></button>';
    });
    $("chips").innerHTML = html;
    var opts = '<option value="">Tutti</option>';
    types().forEach(function(t){ opts += '<option value="'+esc(t)+'">'+esc(t)+'</option>'; });
    $("tipo").innerHTML = opts;
    $("sub").textContent = G.length+" guide gratuite: trucchi, strumenti e procedure passo passo. Una cosa alla volta, da provare subito.";
  }
  $("chips").addEventListener("click",function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    state.cat = b.getAttribute("data-cat");
    [].forEach.call($("chips").children,function(c){ c.setAttribute("aria-pressed", c===b ? "true":"false"); });
    renderList();
  });
  $("tipo").addEventListener("change",function(){ state.tipo = this.value; renderList(); });
  $("q").addEventListener("input",function(){ state.q = this.value; $("clear").classList.toggle("on", !!this.value); renderList(); });
  $("clear").addEventListener("click",function(){ $("q").value=""; state.q=""; this.classList.remove("on"); renderList(); $("q").focus(); });

  function matches(){
    var tokens = norm(state.q).split(/\s+/).filter(Boolean);
    var res = G.filter(function(g){
      if(state.cat && g.categoria !== state.cat) return false;
      if(state.tipo && g.tipo !== state.tipo) return false;
      return tokens.every(function(t){ return g._all.indexOf(t) !== -1; });
    });
    if(tokens.length){
      var score = function(g){ return tokens.reduce(function(s,t){ return s + (g._head.indexOf(t)!==-1 ? 1 : 0); },0); };
      res = res.map(function(g,i){ return {g:g,s:score(g),i:i}; })
               .sort(function(a,b){ return b.s-a.s || a.i-b.i; })
               .map(function(x){ return x.g; });
    }
    return res;
  }

  function rowHTML(g){
    return '<li><a class="row" href="#g='+esc(g.id)+'">'
      + '<div class="row-head"><span class="cat"><span class="dot" style="--c:'+colorFor(g.categoria)+'"></span>'+esc(g.categoria)+'</span>'
      + (g.tipo?'<span>'+esc(g.tipo)+'</span>':'')
      + (g.data?'<span>'+esc(fmtDate(g.data))+'</span>':'')+'</div>'
      + '<h2 class="row-title">'+esc(g.titolo)+'</h2>'
      + '<p class="row-sum">'+esc(g.sommario||"")+'</p></a></li>';
  }
  function renderList(){
    var res = matches();
    $("count").textContent = res.length === 1 ? "1 guida" : res.length+" guide";
    if(!res.length){
      $("list").innerHTML = '<li class="empty"><strong>Nessuna guida trovata</strong>Prova con meno parole, oppure togli i filtri. Se manca un argomento, scrivilo nel canale Telegram.<br><button class="pill" id="reset" type="button">Mostra tutte le guide</button></li>';
      $("reset").addEventListener("click",resetAll);
      return;
    }
    $("list").innerHTML = res.map(rowHTML).join("");
  }
  function resetAll(){
    state = {q:"",cat:"",tipo:""}; $("q").value=""; $("clear").classList.remove("on"); $("tipo").value="";
    [].forEach.call($("chips").children,function(c,i){ c.setAttribute("aria-pressed", i===0?"true":"false"); });
    renderList();
  }

  /* contenuto di una guida */
  var STEP = /^\d️?⃣\s*/;
  function parse(text){
    var lines = String(text).split("\n"), out = "", mode = "";
    function close(){ if(mode==="ol") out+="</ol>"; if(mode==="ul") out+="</ul>"; mode=""; }
    lines.forEach(function(raw){
      var l = raw.replace(/\s+$/,"");
      if(!l.trim()){ close(); return; }
      if(STEP.test(l)){
        if(mode!=="ol"){ close(); out+='<ol class="steps">'; mode="ol"; }
        out += "<li>"+esc(l.replace(STEP,""))+"</li>"; return;
      }
      if(l.indexOf("• ")===0){
        if(mode!=="ul"){ close(); out+="<ul>"; mode="ul"; }
        out += "<li>"+esc(l.slice(2))+"</li>"; return;
      }
      close();
      if(l.indexOf("> ")===0){
        var c = l.slice(2);
        out += '<div class="cmd"><code>'+esc(c)+'</code><button type="button" data-copy="'+esc(c)+'">Copia</button></div>'; return;
      }
      if(l.indexOf("⚠")===0){ out += '<div class="note warn"><b>Attenzione</b>'+esc(l.replace(/^⚠️?\s*/,""))+'</div>'; return; }
      if(l.indexOf("💡")===0){ out += '<div class="note tip"><b>Consiglio</b>'+esc(l.replace(/^💡\s*/,""))+'</div>'; return; }
      out += "<p>"+esc(l)+"</p>";
    });
    close();
    return out;
  }

  function showGuide(g){
    var related = G.filter(function(x){ return x.categoria===g.categoria && x.id!==g.id; }).slice(0,3);
    var html = '<a class="back" href="#">← Tutte le guide</a>'
      + '<h1>'+esc(g.titolo)+'</h1>'
      + (g.sommario?'<p class="lead">'+esc(g.sommario)+'</p>':'')
      + '<div class="read-meta"><span class="cat"><span class="dot" style="--c:'+colorFor(g.categoria)+'"></span>'+esc(g.categoria)+'</span>'
      + (g.tipo?'<span>'+esc(g.tipo)+'</span>':'')
      + (g.data?'<span>'+esc(fmtDate(g.data))+'</span>':'')
      + g.tag.map(function(t){ return '<button class="tag" type="button" data-tag="'+esc(t)+'">'+esc(t)+'</button>'; }).join("")
      + '</div>'
      + '<div class="article">'+parse(g.testo)+'</div>'
      + '<div class="actions"><button class="pill primary" type="button" id="share">Copia il link della guida</button>'
      + '<a class="pill" href="https://t.me/doditech" target="_blank" rel="noopener">Altre guide su Telegram</a></div>'
      + (related.length ? '<div class="more"><h2>Altre guide su '+esc(g.categoria)+'</h2><ul class="list">'+related.map(rowHTML).join("")+'</ul></div>' : '');
    $("read").innerHTML = html;
    $("home").hidden = true; $("read").hidden = false;
    document.title = g.titolo+" · DODITECH";
    window.scrollTo(0,0);
  }
  function showHome(){
    $("read").hidden = true; $("home").hidden = false;
    document.title = "DODITECH · Guide in pillole per smanettoni";
  }
  function route(){
    var m = location.hash.match(/^#g=([\w-]+)/);
    var g = m && G.filter(function(x){ return x.id===m[1]; })[0];
    if(g){ showGuide(g); } else { showHome(); }
  }
  window.addEventListener("hashchange",route);

  $("read").addEventListener("click",function(e){
    var cp = e.target.closest("[data-copy]");
    if(cp){ copy(cp.getAttribute("data-copy")).then(function(ok){ toast(ok?"Comando copiato":"Copia non riuscita: selezionalo a mano"); }); return; }
    if(e.target.id==="share"){ copy(location.href).then(function(ok){ toast(ok?"Link copiato":"Copia non riuscita"); }); return; }
    var tg = e.target.closest("[data-tag]");
    if(tg){ location.hash=""; resetAll(); $("q").value = tg.getAttribute("data-tag"); state.q = $("q").value; $("clear").classList.add("on"); renderList(); window.scrollTo(0,0); }
  });
  document.addEventListener("keydown",function(e){
    var typing = /input|textarea|select/i.test((e.target.tagName||""));
    if(e.key==="/" && !typing && !$("home").hidden){ e.preventDefault(); $("q").focus(); }
    if(e.key==="Escape" && !$("read").hidden){ location.hash=""; }
  });

  buildFilters();
  renderList();
  route();
})();
</script>
</body>
</html>
